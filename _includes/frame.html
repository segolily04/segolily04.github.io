{% assign k = include.kind | default: "photo" %}
<figure class="frame frame--{{ k }}{% if include.tilt %} frame--tilt{% endif %}">
  <div class="frame__slot" role="img" aria-label="{{ include.alt | default: 'Placeholder for a real image' }}">
    {% if k == "diagram" %}
      {% if include.variant == "feedback" %}
      <svg viewBox="0 0 400 300" class="frame__ph" aria-hidden="true" focusable="false"><rect width="400" height="300" fill="#F3EADC"/><g font-family="DM Sans, sans-serif" font-size="13" font-weight="600" fill="#123552"><circle cx="110" cy="90" r="42" fill="#A9C0A5"/><text x="110" y="95" text-anchor="middle">What worked</text><circle cx="290" cy="90" r="42" fill="#E4B363"/><text x="290" y="88" text-anchor="middle">Try</text><text x="290" y="104" text-anchor="middle">next</text><circle cx="200" cy="215" r="46" fill="#E8977A"/><text x="200" y="213" text-anchor="middle">Leave</text><text x="200" y="229" text-anchor="middle">encouraged</text></g><g fill="none" stroke="#9A3D22" stroke-width="2.5" stroke-linecap="round"><path d="M152 100l86 0" marker-end="url(#fa)"/><path d="M276 128l-60 46" marker-end="url(#fa)"/></g><defs><marker id="fa" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1.5L8 5L1 8.5" fill="none" stroke="#9A3D22" stroke-width="1.6" stroke-linecap="round"/></marker></defs></svg>
      {% else %}
      <svg viewBox="0 0 400 300" class="frame__ph" aria-hidden="true" focusable="false"><rect width="400" height="300" fill="#F3EADC"/><rect x="170" y="38" width="60" height="26" rx="4" fill="#123552"/><text x="200" y="56" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="12" font-weight="600" fill="#FBF3EB">Speaker</text><g fill="#7E9B7E"><circle cx="86" cy="120" r="15"/><circle cx="120" cy="170" r="15"/><circle cx="158" cy="212" r="15"/><circle cx="314" cy="120" r="15"/><circle cx="280" cy="170" r="15"/><circle cx="242" cy="212" r="15"/></g><g fill="none" stroke="#2E5A8F" stroke-width="2" stroke-dasharray="4 5" opacity=".7"><path d="M86 120L200 64"/><path d="M314 120L200 64"/><path d="M158 212L242 212"/></g><text x="200" y="270" text-anchor="middle" font-family="Caveat, cursive" font-size="19" fill="#8A5B13">the V, so everyone faces in</text></svg>
      {% endif %}
    {% elsif k == "sketch" %}
    <svg viewBox="0 0 400 300" class="frame__ph" aria-hidden="true" focusable="false"><rect width="400" height="300" fill="#F3EADC"/><g fill="none" stroke="#2B2A28" stroke-width="2" stroke-linecap="round" opacity=".55"><path d="M40 210c40-90 90-130 150-120s110 70 90 130"/><path d="M70 150l40-40 30 30 50-55 40 45"/><circle cx="300" cy="90" r="34"/><path d="M265 230h120"/></g><text x="200" y="285" text-anchor="middle" font-family="Caveat, cursive" font-size="20" fill="#8A5B13">a sketch goes here</text></svg>
    {% elsif k == "screen" %}
    <svg viewBox="0 0 400 300" class="frame__ph" aria-hidden="true" focusable="false"><rect width="400" height="300" fill="#123552"/><rect x="0" y="0" width="400" height="34" fill="#0B2A45"/><circle cx="22" cy="17" r="5" fill="#D96F43"/><circle cx="40" cy="17" r="5" fill="#E4B363"/><circle cx="58" cy="17" r="5" fill="#7E9B7E"/><g fill="#A9C3DA" opacity=".8"><rect x="24" y="60" width="150" height="12" rx="3"/><rect x="24" y="84" width="110" height="10" rx="3"/></g><g fill="#2E5A8F"><rect x="24" y="120" width="160" height="150" rx="6"/></g><rect x="206" y="120" width="170" height="70" rx="6" fill="#447299"/><rect x="206" y="200" width="170" height="70" rx="6" fill="#1B4262"/></svg>
    {% else %}
    <svg viewBox="0 0 400 300" class="frame__ph" aria-hidden="true" focusable="false"><rect width="400" height="300" fill="#E3E1DD"/><path d="M0 220c70-40 120-40 200 0s130 30 200-10v90H0z" fill="#A9C3DA" opacity=".7"/><circle cx="300" cy="80" r="40" fill="#E4B363"/><path d="M0 250c80-30 130-20 200 5s130 20 200-15v60H0z" fill="#7E9B7E" opacity=".7"/></svg>
    {% endif %}
  </div>
  {% if include.caption %}<figcaption class="frame__cap">{{ include.caption }}</figcaption>{% endif %}
</figure>
